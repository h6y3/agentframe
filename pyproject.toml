[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentframe"
version = "0.2.0"
description = "Agent-native web framework where the Product Graph is the source of truth"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlmodel>=0.0.19",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "typer>=0.12",
    "resend>=0.7",
    "starlette-csrf>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.3.0",
]

[project.scripts]
agentframe = "agentframe.deployment.cli:app"

[tool.setuptools.packages.find]
include = ["agentframe*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
