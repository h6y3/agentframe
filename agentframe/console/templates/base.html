<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentFrame Console{% block title_suffix %}{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; }

        /* Layout */
        .console-header {
            background: #0f172a; color: #f8fafc; padding: 0.75rem 1.5rem;
            display: flex; align-items: center; gap: 1.5rem;
        }
        .console-header h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.05em; }
        .console-header a { color: #94a3b8; text-decoration: none; font-size: 0.875rem; }
        .console-header a:hover { color: #f8fafc; }
        .console-header a.active { color: #60a5fa; font-weight: 500; }
        .console-main { display: flex; min-height: calc(100vh - 48px); }

        /* Sidebar */
        .sidebar {
            width: 260px; min-width: 260px; background: #fff;
            border-right: 1px solid #e2e8f0; padding: 1rem 0; overflow-y: auto;
        }
        .sidebar-section { margin-bottom: 1.5rem; }
        .sidebar-section-title {
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: #94a3b8; padding: 0 1rem 0.5rem;
        }
        .sidebar-item {
            display: block; padding: 0.4rem 1rem; font-size: 0.875rem; color: #475569;
            text-decoration: none; cursor: pointer; border: none; background: none; width: 100%; text-align: left;
        }
        .sidebar-item:hover { background: #f1f5f9; color: #1e293b; }
        .sidebar-item.selected { background: #eff6ff; color: #2563eb; font-weight: 500; }
        .node-type-badge {
            display: inline-block; font-size: 0.65rem; padding: 0.1rem 0.35rem;
            border-radius: 3px; margin-right: 0.4rem; font-weight: 600; vertical-align: middle;
        }
        .badge-entity { background: #dbeafe; color: #1d4ed8; }
        .badge-flow   { background: #dcfce7; color: #15803d; }
        .badge-page   { background: #fef9c3; color: #a16207; }
        .badge-policy { background: #fce7f3; color: #9d174d; }

        /* Main content */
        .content { flex: 1; padding: 1.5rem; overflow-y: auto; }
        .content h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; }

        /* Cards */
        .card {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
            padding: 1.25rem; margin-bottom: 1rem;
        }
        .card-title { font-weight: 600; margin-bottom: 0.5rem; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th { text-align: left; font-size: 0.75rem; font-weight: 600; color: #64748b;
             text-transform: uppercase; letter-spacing: 0.05em; padding: 0.5rem 0.75rem;
             border-bottom: 2px solid #e2e8f0; background: #f8fafc; }
        td { padding: 0.6rem 0.75rem; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
        tr:hover td { background: #f8fafc; }
        tr.clickable { cursor: pointer; }

        /* Status badges */
        .status-badge {
            display: inline-block; font-size: 0.7rem; padding: 0.2rem 0.5rem;
            border-radius: 999px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .status-pending    { background: #fef3c7; color: #92400e; }
        .status-auto_approved { background: #dbeafe; color: #1e40af; }
        .status-approved   { background: #dcfce7; color: #166534; }
        .status-rejected   { background: #fee2e2; color: #991b1b; }

        /* Forms & Buttons */
        .btn {
            display: inline-block; padding: 0.4rem 1rem; border-radius: 5px;
            font-size: 0.875rem; font-weight: 500; cursor: pointer;
            border: none; text-decoration: none; transition: background 0.15s;
        }
        .btn-approve { background: #16a34a; color: #fff; }
        .btn-approve:hover { background: #15803d; }
        .btn-reject  { background: #dc2626; color: #fff; margin-left: 0.5rem; }
        .btn-reject:hover  { background: #b91c1c; }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }

        /* Code / JSON */
        pre {
            background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 6px;
            font-size: 0.8rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
        }

        /* Policy result list */
        .policy-list { list-style: none; }
        .policy-list li { padding: 0.35rem 0; font-size: 0.875rem; }
        .policy-pass { color: #16a34a; }
        .policy-fail-error { color: #dc2626; }
        .policy-fail-warn  { color: #d97706; }

        /* Diff */
        .diff-add    { background: #dcfce7; color: #166534; }
        .diff-remove { background: #fee2e2; color: #991b1b; }

        /* Node detail panel */
        #node-detail { animation: fadein 0.15s ease; }
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

        .detail-label { font-size: 0.75rem; color: #64748b; font-weight: 600;
                        text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        .detail-value { margin-bottom: 1rem; }

        /* Alerts */
        .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.875rem; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .alert-info    { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
        .alert-warn    { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }

        /* Secret / deploy specific */
        .value-set   { color: #16a34a; font-weight: 600; }
        .value-unset { color: #dc2626; font-weight: 600; }
        input[type="password"], input[type="text"] {
            padding: 0.4rem 0.6rem; border: 1px solid #cbd5e1; border-radius: 4px;
            font-size: 0.875rem; width: 100%; max-width: 360px;
        }
        .form-inline { display: flex; gap: 0.5rem; align-items: center; }
    </style>
</head>
<body>
<header class="console-header">
    <h1>⬡ AgentFrame Console</h1>
    <a href="/_console" {% if active_page == 'explorer' %}class="active"{% endif %}>Graph Explorer</a>
    <a href="/_console/proposals" {% if active_page == 'proposals' %}class="active"{% endif %}>Proposals</a>
    <a href="/_console/secrets" {% if active_page == 'secrets' %}class="active"{% endif %}>Secrets</a>
    <a href="/_console/deploy" {% if active_page == 'deploy' %}class="active"{% endif %}>Deploy</a>
    <a href="/" style="margin-left: auto;">← App</a>
</header>
<div class="console-main">
    {% block body %}{% endblock %}
</div>
</body>
</html>
